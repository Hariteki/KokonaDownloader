<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    :root { color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }
    body {
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      font-size: 14px; background: #f3f3f3; color: #1b1b1b; margin: 0;
      display: flex; justify-content: center; padding: 32px 16px;
    }
    .card {
      width: 480px; background: #fff; border: 1px solid #e5e5e5;
      border-radius: 10px; padding: 24px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #767676; font-size: 12px; margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 13px; }
    input[type=text], input[type=number], input[type=password] {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 1px solid #c8c8c8; border-radius: 6px; font-size: 14px; outline: none;
    }
    input:focus { border-color: #60CDFF; }
    .hint { color: #6b6b6b; font-size: 12px; margin-top: 4px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 18px; padding: 12px; border-radius: 8px; background: rgba(128,128,128,.06);
    }
    .switch-row .t { font-weight: 600; font-size: 13px; }
    .switch-row .d { font-size: 12px; color: #767676; margin-top: 2px; }
    button {
      padding: 8px 16px; border: 1px solid #c8c8c8; border-radius: 6px;
      font-size: 14px; cursor: pointer; background: #f5f5f5;
    }
    button.primary { background: #60CDFF; border-color: #60CDFF; color: #003147; font-weight: 600; }
    button:hover { filter: brightness(.96); }
    .btns { display: flex; gap: 10px; margin-top: 22px; }
    .result { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .result.ok { color: #2E9E5B; }
    .result.err { color: #C42B1C; }
    .toggle { position: relative; width: 44px; height: 22px; flex: none; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .track {
      position: absolute; inset: 0; border-radius: 11px; background: #8a8a8a;
      transition: background .15s; cursor: pointer;
    }
    .toggle .track::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #fff; top: 4px; left: 4px; transition: left .15s;
    }
    .toggle input:checked + .track { background: #60CDFF; }
    .toggle input:checked + .track::after { left: 26px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #eee; }
      .card { background: #262626; border-color: #3a3a3a; }
      input, select { background: #2d2d2d; color: #eee; border-color: #444; }
      .hint { color: #9a9a9a; }
      .sub { color: #9a9a9a; }
      .switch-row .d { color: #9a9a9a; }
      button { background: #2d2d2d; color: #eee; border-color: #444; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>海兔下载器 · 扩展设置</h1>
    <div class="sub">配置与桌面客户端的连接。连接密钥请点击浏览器工具栏图标，在弹窗中粘贴设置。</div>

    <div class="row">
      <div>
        <label for="host">客户端地址</label>
        <input type="text" id="host" placeholder="127.0.0.1" />
      </div>
      <div>
        <label for="port">端口</label>
        <input type="number" id="port" min="1" max="65535" placeholder="16800" />
      </div>
    </div>

    <div class="switch-row">
      <div>
        <div class="t">自动接管浏览器下载</div>
        <div class="d">开启后，浏览器中的下载会自动转给客户端；关闭则仅右键菜单手动发送。</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="autoCapture" />
        <span class="track"></span>
      </label>
    </div>

    <div class="btns">
      <button id="saveBtn" class="primary">保存</button>
    </div>
    <div id="result" class="result"></div>
  </div>
  <script src="logic.js"></script>
  <script src="options.js"></script>
</body>
</html>
