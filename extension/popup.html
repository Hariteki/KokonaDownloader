<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    :root { color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }
    body {
      width: 320px; margin: 0; padding: 14px;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      font-size: 13px; background: #fff; color: #1b1b1b;
    }
    .head { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .dot.on { background: #2E9E5B; box-shadow: 0 0 8px rgba(46,158,91,.85); }
    .dot.off { background: #C42B1C; box-shadow: 0 0 8px rgba(196,43,28,.85); }
    .dot.check { background: #FACC15; box-shadow: 0 0 8px rgba(250,204,21,.85); }
    .status { padding: 10px 12px; border-radius: 8px; background: rgba(128,128,128,.08); margin: 10px 0; }
    .status .t { font-weight: 600; font-size: 13px; }
    .sub { color: #767676; font-size: 12px; margin-top: 2px; }
    .klabel { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    input[type=password], input[type=text] {
      width: 100%; box-sizing: border-box; padding: 9px 11px;
      border: 1px solid #c8c8c8; border-radius: 6px; font-size: 13px; outline: none;
    }
    input[type=password]:focus, input[type=text]:focus { border-color: #60CDFF; }
    #urlInput { margin-top: 12px; }
    button {
      padding: 7px 12px; border: 1px solid #c8c8c8; border-radius: 6px;
      font-size: 13px; cursor: pointer; background: #f5f5f5;
    }
    button.primary { background: #60CDFF; border-color: #60CDFF; color: #003147; font-weight: 600; }
    button:hover { filter: brightness(.96); }
    button:disabled { opacity: .6; cursor: default; }
    .big {
      width: 100%; margin-top: 10px; padding: 11px 12px;
      font-size: 15px; font-weight: 700; letter-spacing: 8px; text-indent: 8px;
      border-radius: 8px; box-shadow: 0 2px 10px rgba(96,205,255,.5);
    }
    .mini {
      border: none; background: transparent; color: #0067C0;
      font-size: 11px; padding: 2px 4px; text-decoration: underline; cursor: pointer;
    }
    .connected-row { text-align: right; margin-top: 4px; }
    .hint { color: #767676; font-size: 11px; margin-top: 8px; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between;
      margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: rgba(128,128,128,.08);
    }
    .switch-row .t { font-weight: 600; font-size: 13px; }
    .switch-row .d { font-size: 11px; color: #767676; margin-top: 2px; }
    .toggle { position: relative; width: 40px; height: 20px; flex: none; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .track {
      position: absolute; inset: 0; border-radius: 10px; background: #8a8a8a;
      transition: background .15s; cursor: pointer;
    }
    .toggle .track::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px; transition: left .15s;
    }
    .toggle input:checked + .track { background: #60CDFF; }
    .toggle input:checked + .track::after { left: 23px; }
    .hidden { display: none; }
    .msg { margin-top: 8px; font-size: 12px; min-height: 16px; }
    .msg.ok { color: #2E9E5B; }
    .msg.err { color: #C42B1C; }
    .send { width: 100%; margin-top: 10px; }
    .footer { margin-top: 12px; display: flex; justify-content: space-between; }
    a { color: #0067C0; text-decoration: none; font-size: 12px; }
    a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { background: #202020; color: #eee; }
      input, button { background: #2d2d2d; color: #eee; border-color: #444; }
      button.primary { background: #60CDFF; border-color: #60CDFF; color: #003147; }
      .mini { color: #60CDFF; }
      .sub, .hint { color: #9a9a9a; }
      .switch-row .d { color: #9a9a9a; }
      a { color: #60CDFF; }
    }
  </style>
</head>
<body>
  <div class="head">
    <h1>海兔下载器</h1>
    <span id="dot" class="dot check"></span>
  </div>

  <div class="status">
    <div class="t" id="statusText">正在检测…</div>
    <div class="sub" id="statusDetail"></div>
  </div>

  <div class="switch-row">
    <div>
      <div class="t">自动接管浏览器下载</div>
      <div class="d">开启后浏览器下载自动转给客户端</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="autoCapture" />
      <span class="track"></span>
    </label>
  </div>

  <div id="setupSection">
    <div class="klabel">粘贴连接密钥</div>
    <input type="password" id="keyInput" placeholder="粘贴密钥后立即自动连接…" autocomplete="off" />
    <button id="connectBtn" class="primary big">粘贴并连接</button>
    <div class="hint">密钥在客户端「设置 → 浏览器扩展连接」中查看；点上方按钮自动读剪贴板连接，也可手动粘贴。</div>
  </div>

  <div id="connectedRow" class="connected-row hidden">
    <button id="modifyBtn" class="mini">修改密钥</button>
  </div>

  <input type="text" id="urlInput" placeholder="粘贴下载链接后发送…" />
  <button id="sendBtn" class="primary send">发送下载</button>
  <div id="msg" class="msg"></div>

  <div class="footer">
    <a href="#" id="openOptions">扩展设置</a>
    <a href="#" id="helpLink">使用帮助</a>
  </div>
  <script src="logic.js"></script>
  <script src="popup.js"></script>
</body>
</html>
