<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; width: 320px; padding: 14px;
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      background: #202020; color: #e8e8e8;
    }
    h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8a8a8a; }
    .dot.on { background: #4cc27a; } .dot.err { background: #e05a4f; } .dot.paused { background: #c77b2a; }
    .row { margin: 10px 0; }
    .toggle {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; margin: 4px 0 10px; border-radius: 10px; cursor: pointer; user-select: none;
      background: #2b2b2b; border: 1px solid #3a3a3a;
    }
    .toggle.off { background: #262626; border-color: #3a3a3a; }
    .toggle .label { font-size: 13px; font-weight: 600; }
    .toggle .track {
      flex: 0 0 auto; width: 40px; height: 22px; border-radius: 11px; background: #4cc27a; position: relative; transition: background .15s;
    }
    .toggle.off .track { background: #4a4a4a; }
    .toggle .knob {
      position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
      /* 开：圆球在胶囊右侧；关：回到左侧 */
      transform: translateX(18px);
      transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    .toggle.off .knob { transform: translateX(0); }
    button {
      width: 100%; padding: 7px 10px; margin-top: 6px; border-radius: 6px; cursor: pointer;
      border: 1px solid #3a3a3a; background: #333; color: #eee; font: inherit;
    }
    button.primary { background: #2f6fd0; border-color: #2f6fd0; }
    /* 站点放行是"危险动作"：橙色底色，明显区别于普通按钮 */
    button.site {
      padding: 11px 12px; font-size: 13px; font-weight: 600;
      background: #d97706; border-color: #d97706; color: #fff;
    }
    button.site.bypassed { background: #3a2b18; border-color: #d97706; color: #ffc46b; }
    button:disabled { opacity: .5; cursor: default; }
    .link { font-size: 12px; color: #6ea8fe; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
  <h1><span id="dot" class="dot"></span>海兔下载器</h1>

  <div class="toggle" id="captureToggle" role="switch" aria-checked="true" tabindex="0">
    <div class="label">自动接管浏览器下载</div>
    <div class="track"><div class="knob"></div></div>
  </div>

  <div class="row">
    <button id="siteBypass" class="site">本网站不接管下载</button>
  </div>

  <div class="row">
    <button id="paste" class="primary">粘贴密钥并连接</button>
  </div>

  <div class="row">
    <button id="grant">授权访问网站（用于带上登录 Cookie）</button>
  </div>

  <div class="row">
    <a class="link" id="options">更多设置</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
